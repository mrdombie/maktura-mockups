<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:linear-gradient(135deg,#FFFCF7 0%,#FFE6DD 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;font:600 'Inter',-apple-system,sans-serif;color:#1A2940;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-300px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(255,107,71,0.18) 0%,transparent 60%);border-radius:50%}
body::after{content:'';position:absolute;bottom:-400px;left:-200px;width:800px;height:800px;background:radial-gradient(circle,rgba(255,200,87,0.15) 0%,transparent 60%);border-radius:50%}
.mark{width:180px;height:180px;position:relative;z-index:1}
.wordmark{font:800 96px/1 'Inter',sans-serif;letter-spacing:-0.04em;margin-top:20px;background:linear-gradient(135deg,#FF6B47 0%,#FFC857 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:1}
.tagline{font:500 24px/1.4 'Inter',sans-serif;color:#475569;margin-top:10px;position:relative;z-index:1;text-align:center}
.url{position:absolute;bottom:36px;font:700 16px/1 'JetBrains Mono',monospace;color:#1A2940;letter-spacing:0.1em;text-transform:uppercase;z-index:1}
</style></head><body>
<svg class="mark" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF6B47"/><stop offset="100%" stop-color="#FFC857"/></linearGradient></defs><line x1="50" y1="60" x2="50" y2="140" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><line x1="50" y1="60" x2="100" y2="120" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><line x1="100" y1="120" x2="150" y2="60" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><line x1="150" y1="60" x2="150" y2="140" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="60" r="14" fill="#FF6B47"/><circle cx="150" cy="60" r="14" fill="#FFC857"/><circle cx="100" cy="120" r="14" fill="url(#g)"/><circle cx="50" cy="140" r="11" fill="#FFD8B2"/><circle cx="150" cy="140" r="11" fill="#FFD8B2"/></svg>
<div class="wordmark">Maktura</div>
<div class="tagline">An AI that's actually you.</div>
<div class="url">MAKTURA.COM</div>
</body></html>

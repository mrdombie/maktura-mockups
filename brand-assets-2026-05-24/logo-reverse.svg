<?xml version="1.0" encoding="UTF-8"?>
<!-- Maktura mark · REVERSE variant · Warm-white on transparent (use on dark backgrounds). Concept 2 brand-locked. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="Maktura">
  <line x1="50" y1="60" x2="50" y2="140" stroke="#FFFCF7" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="100" y2="120" stroke="#FFFCF7" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="150" y2="60" stroke="#FFFCF7" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="60" x2="150" y2="140" stroke="#FFFCF7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="60" r="14" fill="#FFFCF7"/>
  <circle cx="150" cy="60" r="14" fill="#FFFCF7"/>
  <circle cx="100" cy="120" r="14" fill="#FFFCF7"/>
  <circle cx="50" cy="140" r="11" fill="#FFFCF7"/>
  <circle cx="150" cy="140" r="11" fill="#FFFCF7"/>
</svg>
